<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marker Creator – Campus AR</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    /* ── Layout ─────────────────────────────────────────────── */
    body { display: flex; flex-direction: column; min-height: 100vh; background: #0a0a0a; }

    .creator-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #1e1e1e;
    }
    .creator-header a {
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .creator-header a:hover { color: #f0f0f0; }
    .creator-header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #f0f0f0;
      margin: 0;
    }

    /* ── Step indicator ─────────────────────────────────────── */
    .step-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
    }
    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      transition: background 0.25s;
    }
    .step-dot.active { background: #e25822; }
    .step-dot.done   { background: #555; }

    /* ── Step panels ────────────────────────────────────────── */
    .step { display: none; flex: 1; flex-direction: column; align-items: center; padding: 20px; }
    .step.active { display: flex; }

    /* ── Camera view ────────────────────────────────────────── */
    .camera-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
    }
    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-guide {
      position: absolute;
      inset: 12%;
      border: 2px dashed rgba(226,88,34,0.6);
      border-radius: 4px;
      pointer-events: none;
    }
    .camera-guide::before {
      content: 'Frame the image here';
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: rgba(226,88,34,0.8);
      white-space: nowrap;
    }

    /* ── Camera controls ────────────────────────────────────── */
    .camera-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 32px;
    }
    .btn-capture {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #e25822;
      border: 4px solid #fff;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .btn-capture:active { transform: scale(0.93); }
    .btn-icon {
      background: none;
      border: none;
      color: #888;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }
    .btn-icon:hover { color: #f0f0f0; background: #1e1e1e; }

    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 8px 14px;
      border: 1px solid #333;
      border-radius: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    .upload-label:hover { border-color: #555; color: #ccc; }
    #file-input { display: none; }

    /* ── Preview / validation ───────────────────────────────── */
    .preview-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
    }
    #preview-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Validation card ────────────────────────────────────── */
    .validation-card {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      background: #111;
      border: 1px solid #1e1e1e;
      padding: 16px;
      margin-top: 16px;
    }
    .validation-card.valid   { border-color: #2a6b3a; }
    .validation-card.invalid { border-color: #6b2a2a; }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .score-label { font-size: 0.85rem; color: #888; }
    .score-badge {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .score-badge.good { background: #1a3d25; color: #4ade80; }
    .score-badge.warn { background: #3d3110; color: #facc15; }
    .score-badge.bad  { background: #3d1010; color: #f87171; }

    .score-bar-track {
      height: 4px;
      background: #1e1e1e;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .score-bar-fill {
      height: 4px;
      border-radius: 2px;
      background: #e25822;
      transition: width 0.4s ease;
    }

    .message-list { list-style: none; padding: 0; margin: 0; }
    .message-list li {
      display: flex;
      gap: 8px;
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .message-list li .icon { flex-shrink: 0; }
    .msg-error   { color: #f87171; }
    .msg-warning { color: #facc15; }
    .msg-ok      { color: #4ade80; }

    /* ── Marker preview (with printed border) ───────────────── */
    .marker-preview-label {
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      margin: 8px 0 4px;
    }
    #marker-preview-canvas {
      width: 160px;
      height: 160px;
      border-radius: 4px;
      margin: 0 auto;
      display: block;
    }

    /* ── Name input ─────────────────────────────────────────── */
    .name-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
      margin-top: 14px;
    }
    .name-row input {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      color: #f0f0f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .name-row input:focus { border-color: #e25822; }
    .name-row input::placeholder { color: #444; }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn-primary {
      background: #e25822;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
      max-width: 400px;
    }
    .btn-primary:hover   { background: #c94f1e; }
    .btn-primary:active  { transform: scale(0.98); }
    .btn-primary:disabled { background: #333; color: #555; cursor: not-allowed; }

    .btn-secondary {
      background: none;
      border: 1px solid #333;
      border-radius: 10px;
      color: #888;
      padding: 11px 24px;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: #555; color: #ccc; }

    /* ── Result step ────────────────────────────────────────── */
    .result-card {
      width: 100%;
      max-width: 400px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 20px;
    }
    .result-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #4ade80;
      margin-bottom: 6px;
    }
    .result-path {
      font-size: 0.8rem;
      color: #555;
      font-family: monospace;
      word-break: break-all;
      margin-bottom: 16px;
    }

    /* ── Status message ─────────────────────────────────────── */
    .status-msg {
      font-size: 0.82rem;
      color: #888;
      text-align: center;
      min-height: 20px;
      margin-top: 8px;
    }
    .status-msg.ok  { color: #4ade80; }
    .status-msg.err { color: #f87171; }

    /* ── Spacers ─────────────────────────────────────────────── */
    .gap-sm { height: 12px; }
    .gap-md { height: 20px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="creator-header">
    <a href="../index.html">← Back</a>
    <h1>Marker Creator</h1>
  </header>

  <!-- Step indicator -->
  <div class="step-bar">
    <div class="step-dot active" id="dot-0"></div>
    <div class="step-dot"        id="dot-1"></div>
    <div class="step-dot"        id="dot-2"></div>
  </div>

  <!-- ── Step 0: Capture ───────────────────────────────────── -->
  <section class="step active" id="step-capture">
    <div class="camera-wrapper">
      <video id="camera-video" autoplay playsinline muted></video>
      <div class="camera-guide"></div>
    </div>

    <div class="camera-controls">
      <label class="upload-label" title="Upload from gallery">
        <span>&#128247;</span> Upload
        <input type="file" id="file-input" accept="image/*" />
      </label>

      <button class="btn-capture" id="btn-capture" title="Take photo" aria-label="Capture"></button>

      <button class="btn-icon" id="btn-flip" title="Flip camera">&#8635;</button>
    </div>

    <div class="gap-md"></div>
    <p class="status-msg" id="capture-status">Starting camera…</p>
  </section>

  <!-- ── Step 1: Validate ──────────────────────────────────── -->
  <section class="step" id="step-validate">
    <div class="preview-wrapper">
      <canvas id="preview-canvas"></canvas>
    </div>

    <div class="validation-card" id="validation-card">
      <div class="score-row">
        <span class="score-label">Marker quality</span>
        <span class="score-badge" id="score-badge">—</span>
      </div>
      <div class="score-bar-track">
        <div class="score-bar-fill" id="score-bar" style="width:0%"></div>
      </div>
      <ul class="message-list" id="message-list"></ul>
    </div>

    <p class="marker-preview-label">Printed marker preview</p>
    <canvas id="marker-preview-canvas" width="160" height="160"></canvas>

    <div class="name-row">
      <input type="text" id="marker-name" placeholder="marker-name (e.g. solar-panel)" maxlength="48" />
    </div>

    <div class="gap-sm"></div>
    <button class="btn-primary" id="btn-generate" disabled>Generate .patt file</button>
    <div class="gap-sm"></div>
    <button class="btn-secondary" id="btn-retake">Retake photo</button>

    <p class="status-msg" id="validate-status"></p>
  </section>

  <!-- ── Step 2: Result ────────────────────────────────────── -->
  <section class="step" id="step-result">
    <div class="result-card">
      <div class="result-title">&#10003; Marker created</div>
      <div class="result-path" id="result-path"></div>

      <button class="btn-primary" id="btn-download">Download .patt file</button>
      <div class="gap-sm"></div>
      <button class="btn-secondary" id="btn-save-project">Save to project (dev only)</button>
    </div>

    <div class="gap-md"></div>
    <p class="status-msg" id="result-status"></p>
    <div class="gap-sm"></div>
    <button class="btn-secondary" id="btn-new">Create another marker</button>
  </section>

  <script type="module" src="creator.js"></script>
</body>
</html>
